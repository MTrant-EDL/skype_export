name: Build EXE for Skype Export

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest  # 📝 Hinweis: Du solltest runs-on: windows-latest verwenden, wenn du eine .exe für Windows bauen möchtest – andernfalls bekommst du eine Linux-Binärdatei.

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build executable
      run: |
        pyinstaller --onefile skype_json_to_html.py
        dir dist  # Zeigt den Inhalt des dist-Ordners, um sicherzustellen, dass die .exe-Datei existiert

    - name: Verify dist folder exists and .exe file
      run: |
        if (Test-Path "dist/skype_json_to_html.exe") { Write-Host "EXE found" } else { Write-Host "EXE not found"; exit 1 }
        dir dist  # Zeigt den Inhalt des dist-Ordners zur Überprüfung

    - name: Upload exe as artifact 
      uses: actions/upload-artifact@v3
      with:
        name: skype_export_exe
        path: dist/skype_json_to_html.exe
